# DESIGN EXAMPLE ONLY. No parser, evaluator, or optimizer is implemented.
# Metrics and constraints are illustrative, not mandatory goals or an exhaustive catalog.
# Imported keys below are placeholders to resolve through the future adapter.
# Files are user-supplied inputs, relative to this example; they are not included fixtures.

schema_version = 1
game = "poe2"
seed_build = "../local/seed.xml"

[domain]
# All these dimensions participate in the same search; individual locks remain optional.
classes = "all_supported_for_game_version"
ascendancies = "all_legal_for_candidate_class"
passives = "all_supported_for_game_version"
equipment_pool = "../local/items.json"
support_gem_pool = "../local/support-gems.json"
supporting_skill_pool = "../local/supporting-skills.json"
# Pools declare exact availability and permitted gem properties, not imaginary best rolls.
level_budget = "seed_level"
point_budget = "legal_for_level_and_progression"
progression_source = "seed_progression"

# Required skills retain their identities in legal, enabled, usable configurations.
# Their supports/properties/placement are separate optional locks.
# A metric references a requirement's id; requiring a skill need not make it a damage goal.
[[required_skills]]
id = "main"
imported_key = "imported-skill:primary"
role = "damage"
lock_properties = ["identity"]

[[required_skills]]
id = "utility"
imported_key = "imported-skill:supporting"
role = "supporting"
lock_properties = ["identity"]

# Fixed items must remain equipped with their exact instance data/rolls.
# A slot lock is optional; mere presence in the inventory does not satisfy the requirement.
[[required_items]]
instance_id = "imported-item:1"
placement = "any_compatible_equipped_slot"

[[required_items]]
instance_id = "imported-item:2"
placement = "any_compatible_equipped_slot"

[[scenarios]]
id = "bossing"
configuration = "../local/scenarios/bossing.toml"
freeze_external_assumptions = true

[[scenarios]]
id = "mapping"
configuration = "../local/scenarios/mapping.toml"
freeze_external_assumptions = true
# Recompute candidate-derived buffs/reservations/conditions from their actual skill/item
# sources. Frozen external settings must not preserve bonuses from removed supporting skills.
# Mapping uses documented proxy metrics, not a claimed map-clear-time simulator.

[search]
space = "joint_build"
dimensions = ["class", "ascendancy", "passives", "equipment", "support_gems", "supporting_skills"]
max_evaluations = 100000
max_seconds = 900
random_seed = 42
# Illustrative 15-minute budget within the 5–30 minute benchmark target, not a promise.
# Count every dispatched PoB calculation attempt, including extra skill/scenario passes,
# failed attempts, retries, and final verification; reserve verification capacity first.
# Cache hits and cheaply rejected invalid proposals are counted separately.

[execution]
jobs = "auto"
evaluator_workers = "auto"
mode = "throughput" # Or "deterministic" for stable logical batch selection.
memory_budget_mib = 8192 # Illustrative user limit, not a measured requirement.

[output]
directory = "../runs/example"
formats = ["json", "html"]
progress = "sampled"
checkpoint = "warm_start"
export_verified_builds = true

# One illustrative goal. A run need not optimize both scenarios or all required skills.
[objective]
metric = "skill_dps"
skill_id = "main"
scenario = "bossing"
direction = "maximize"
# No unsupported sum of standalone DPS from multiple skills is implied.

[[constraints]]
metric = "fire_resistance_capped_pct"
scenarios = ["bossing", "mapping"]
operator = ">="
value = 75.0
violation_scale = 10.0

[[constraints]]
metric = "cold_resistance_capped_pct"
scenarios = ["bossing", "mapping"]
operator = ">="
value = 75.0
violation_scale = 10.0

[[constraints]]
metric = "lightning_resistance_capped_pct"
scenarios = ["bossing", "mapping"]
operator = ">="
value = 75.0
violation_scale = 10.0

[[constraints]]
metric = "pob_total_ehp"
scenarios = ["bossing", "mapping"]
operator = ">="
value = 20000.0
violation_scale = 20000.0
# PoB's scenario-dependent aggregate; enable only after validating mapping and context.
