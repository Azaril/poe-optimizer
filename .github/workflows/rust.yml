name: Rust

on: [push, pull_request]

# Keep the newest revision of each branch or pull request; both OS jobs still run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Exhaustive parity suites and fixed-deadline CLI checks need optimized
      # runtime code. Keep the test profile's debug and overflow checks enabled.
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test corpus intake tooling
        run: python scripts/test_intake_build_corpus.py
      - name: Test fixed build expectations
        run: python scripts/test_build_expectations.py
      - name: Install Rust
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: 'false'
          cache-on-failure: 'true'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify cache setup preserved Cargo.lock
        run: git diff --exit-code -- Cargo.lock
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('clippy', '--workspace', '--all-targets', '--locked', '--', '-D', 'warnings')
      - name: Test
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('test', '--workspace', '--all-targets', '--locked')
      - name: Test native-only CLI
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('test', '-p', 'poe-optimizer-cli', '--no-default-features', '--all-targets', '--locked')
      - name: Lint native-only CLI
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('clippy', '-p', 'poe-optimizer-cli', '--no-default-features', '--all-targets', '--locked', '--', '-D', 'warnings')
      - name: Verify native-only runtime dependencies
        shell: pwsh
        run: |
          $dependencies = cargo tree -p poe-optimizer-cli --no-default-features --edges normal --prefix none --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies
          if ($dependencies -match '^(poe-optimizer-pob|poe-optimizer-lua-utf8|mlua|mlua-sys|lua-src|luajit-src) ') {
            throw 'Native-only deployment includes a PoB or Lua runtime dependency'
          }
      - name: Install portable target
        run: rustup target add wasm32-unknown-unknown
      - name: Check portable core and native calculations
        run: cargo check -p poe-optimizer-core -p poe-optimizer-engine -p poe-optimizer-data -p poe-optimizer-import -p poe-optimizer-native --lib --target wasm32-unknown-unknown --locked
