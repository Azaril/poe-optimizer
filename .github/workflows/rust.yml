name: Rust

on: [push, pull_request]

# Let running main validation finish; coalesce pending main revisions.
# PRs and other branches still cancel superseded work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Exhaustive parity suites and fixed-deadline CLI checks need optimized
      # runtime code. Keep the test profile's debug and overflow checks enabled.
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test corpus intake tooling
        run: python scripts/test_intake_build_corpus.py
      - name: Test fixed build expectations
        run: python scripts/test_build_expectations.py
      - name: Verify owned mechanics conversion
        run: python scripts/tests/test_export_owned_mechanics.py
      - name: Verify owned import artifact conversion
        run: python scripts/tests/test_export_owned_import_data.py
      - name: Verify owned resistance contribution conversion
        run: python scripts/tests/test_export_owned_resistance.py
      - name: Install Rust
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: 'false'
          cache-on-failure: 'true'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify cache setup preserved Cargo.lock
        run: git diff --exit-code -- Cargo.lock
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('clippy', '--workspace', '--all-targets', '--locked', '--', '-D', 'warnings')
      - name: Test native-only CLI
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('test', '-p', 'poe-optimizer-cli', '--no-default-features', '--all-targets', '--locked')
      - name: Lint native-only CLI
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('clippy', '-p', 'poe-optimizer-cli', '--no-default-features', '--all-targets', '--locked', '--', '-D', 'warnings')
      - name: Verify native-only runtime dependencies
        shell: pwsh
        run: |
          $dependencies = cargo tree -p poe-optimizer-cli --no-default-features --edges normal --prefix none --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies
          if ($dependencies -match '^(poe-optimizer-pob|poe-optimizer-lua-utf8|mlua|mlua-sys|lua-src|luajit-src) ') {
            throw 'Native-only deployment includes a PoB or Lua runtime dependency'
          }
      - name: Install portable target
        run: rustup target add wasm32-unknown-unknown
      - name: Check portable core and native calculations
        run: cargo check -p poe-optimizer-core -p poe-optimizer-engine -p poe-optimizer-data -p poe-optimizer-import -p poe-optimizer-native --lib --target wasm32-unknown-unknown --locked

  # Keep every workspace package and target while separating the two long suites.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [workspace, native, pob]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Rust
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.suite }}
          cache-bin: 'false'
          cache-on-failure: 'true'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify cache setup preserved Cargo.lock
        run: git diff --exit-code -- Cargo.lock
      - name: Test remaining workspace packages
        if: matrix.suite == 'workspace'
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('test', '--workspace', '--exclude', 'poe-optimizer-native', '--exclude', 'poe-optimizer-pob', '--all-targets', '--locked', '--no-fail-fast')
      - name: Test native package
        if: matrix.suite == 'native'
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('test', '-p', 'poe-optimizer-native', '--all-targets', '--locked', '--no-fail-fast')
      - name: Test PoB package
        if: matrix.suite == 'pob'
        shell: pwsh
        run: ./.github/scripts/invoke-with-failure-annotation.ps1 -FilePath cargo -ArgumentList @('test', '-p', 'poe-optimizer-pob', '--all-targets', '--locked', '--no-fail-fast')

      - name: Retain failed PoB source evidence
        if: ${{ failure() && matrix.suite == 'pob' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pob-source-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            runs/r2ad-item-sets-01/source/**/*.log
            runs/r2ad-item-sets-01/source/**/*.json
            runs/r2an-loadout-sync-01/source/**/*.log
            runs/r2an-loadout-sync-01/source/**/*.json
            runs/r2p-parser-factories/**/*.log
            runs/r2p-parser-factories/**/*.json
          if-no-files-found: warn
          retention-days: 7

  # Preserve the required check names and fail them if any OS or suite failed.
  check:
    if: ${{ always() }}
    needs: [validation, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VALIDATION_RESULT: ${{ needs.validation.result }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: Require every validation and test job to pass
        shell: pwsh
        run: |
          if ($env:VALIDATION_RESULT -ne 'success' -or $env:TEST_RESULT -ne 'success') {
            throw "Validation result: $env:VALIDATION_RESULT; test result: $env:TEST_RESULT"
          }
