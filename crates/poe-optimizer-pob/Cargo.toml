[package]
name = "poe-optimizer-pob"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
poe-optimizer-data = { path = "../poe-optimizer-data" }
poe-optimizer-import = { path = "../poe-optimizer-import" }
mlua = { version = "=0.12.1", features = ["luajit", "vendored", "serde"] }
poe-optimizer-core = { path = "../poe-optimizer-core" }
poe-optimizer-lua-utf8 = { path = "../poe-optimizer-lua-utf8" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
poe-optimizer-native = { path = "../poe-optimizer-native" }
poe-optimizer-engine = { path = "../poe-optimizer-engine" }
