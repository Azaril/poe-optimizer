[package]
name = "poe-optimizer-authoring"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Bounded offline formula authoring frontend for the checked native rule IR"
publish = false
autotests = false

[[bin]]
name = "poe-author"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "release"
path = "tests/release.rs"

[dependencies]
poe-optimizer-core = { path = "../poe-optimizer-core" }
# Temporary R1 seam: reuse the sole allocator until offline Import modules move here.
poe-optimizer-import = { path = "../poe-optimizer-import" }
poe-optimizer-host = { path = "../poe-optimizer-host" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Official KDL v2 parser; 6.6+ requires Rust 1.95, beyond this crate's MSRV.
kdl = { version = "=6.5.0", default-features = false }

[dev-dependencies]
poe-optimizer-data = { path = "../poe-optimizer-data", default-features = false }
poe-optimizer-engine = { path = "../poe-optimizer-engine", default-features = false }
tempfile = "3"
sha2 = "0.10"
