[package]
name = "poe-optimizer-authoring"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Bounded offline formula authoring frontend for the checked native rule IR"
publish = false
autotests = false

[[bin]]
name = "poe-author"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
poe-optimizer-core = { path = "../poe-optimizer-core" }
# Published 0.3.0 loses inline escaped characters in optimized builds; upstream fix:
# https://github.com/1e1001/rsutil/commit/78e1f72528982cb25f75b64b94af684598e81229
just-kdl = { git = "https://github.com/1e1001/rsutil", rev = "78e1f72528982cb25f75b64b94af684598e81229" }

[dev-dependencies]
poe-optimizer-data = { path = "../poe-optimizer-data", default-features = false }
poe-optimizer-engine = { path = "../poe-optimizer-engine", default-features = false }
serde_json = { workspace = true }
