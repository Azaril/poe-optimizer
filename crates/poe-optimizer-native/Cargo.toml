[package]
name = "poe-optimizer-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
poe-optimizer-data = { path = "../poe-optimizer-data" }
poe-optimizer-core = { path = "../poe-optimizer-core" }
poe-optimizer-engine = { path = "../poe-optimizer-engine" }
poe-optimizer-import = { path = "../poe-optimizer-import" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native convenience import only; portable hosts assign lineage explicitly.
getrandom = "0.4"
