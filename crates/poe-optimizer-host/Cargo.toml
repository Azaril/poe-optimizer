[package]
name = "poe-optimizer-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Filesystem publication primitives shared by optimizer command-line hosts"
publish = false

[dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
